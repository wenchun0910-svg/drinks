<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>和風茶屋訂購系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        matcha: {
                            50: '#f2f6ee',
                            100: '#e1ecd6',
                            200: '#c5dcb3',
                            300: '#a3c489',
                            400: '#84a864',
                            500: '#678d46', // 主色
                            600: '#4f7035',
                            700: '#3e562c',
                        },
                        wood: {
                            light: '#fefae0', // 背景色
                            DEFAULT: '#dda15e', // 點綴色
                            dark: '#bc6c25'
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #fefae0;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23678d46' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
        
        .loader {
            border: 4px solid #e1ecd6;
            border-top: 4px solid #678d46;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .slide-in {
            transform: translateX(100%);
            transition: transform 0.3s ease-in-out;
        }

        .slide-in.active {
            transform: translateX(0);
        }

        .fade-in {
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            pointer-events: none;
        }
        
        .fade-in.active {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 text-matcha-600 font-bold text-xl">
                <i class="fa-solid fa-leaf"></i>
                <span>和風茶屋</span>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="document.getElementById('admin-login-modal').classList.add('active')" class="text-sm text-gray-500 hover:text-matcha-500 transition-colors">
                    <i class="fa-solid fa-user-gear"></i> 管理
                </button>
                <button onclick="toggleCart()" class="relative p-2 text-gray-600 hover:text-matcha-600 transition-colors">
                    <i class="fa-solid fa-cart-shopping text-xl"></i>
                    <span id="cart-badge" class="absolute top-0 right-0 bg-red-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center scale-0 transition-transform">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-4xl mx-auto w-full px-4 py-6">
        
        <!-- Campaign Banner -->
        <div class="bg-matcha-600 rounded-2xl p-6 text-white shadow-md mb-8 relative overflow-hidden">
            <div class="absolute -right-4 -top-4 opacity-20 text-8xl">
                <i class="fa-solid fa-fan"></i>
            </div>
            <div class="relative z-10">
                <span class="bg-matcha-700 text-xs font-bold px-2 py-1 rounded mb-2 inline-block">目前任務</span>
                <h1 id="campaign-title" class="text-2xl md:text-3xl font-bold mb-1">夏季抹茶特賞訂購</h1>
                <p id="campaign-shop" class="text-matcha-100 text-sm"><i class="fa-solid fa-store mr-1"></i> 和風茶屋 (本店)</p>
            </div>
        </div>

        <!-- Menu Section -->
        <div class="mb-6 flex justify-between items-end">
            <h2 class="text-xl font-bold text-gray-700 border-l-4 border-matcha-500 pl-3">精選菜單</h2>
        </div>
        
        <div id="menu-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 pb-20">
            <!-- Menu items will be injected here by JS -->
        </div>

    </main>

    <!-- Cart Sidebar (Slide In) -->
    <div id="cart-overlay" onclick="toggleCart()" class="fixed inset-0 bg-black bg-opacity-50 z-50 fade-in"></div>
    <div id="cart-sidebar" class="fixed top-0 right-0 h-full w-full md:w-96 bg-white shadow-2xl z-50 slide-in flex flex-col">
        <div class="p-4 border-b flex justify-between items-center bg-matcha-50">
            <h3 class="font-bold text-lg text-matcha-700"><i class="fa-solid fa-basket-shopping mr-2"></i>購物車</h3>
            <button onclick="toggleCart()" class="text-gray-500 hover:text-gray-800 p-2 text-xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        
        <div id="cart-items" class="flex-grow overflow-y-auto p-4 space-y-4 bg-gray-50">
            <!-- Cart items will be injected here -->
            <div class="text-center text-gray-400 py-10">購物車目前是空的</div>
        </div>
        
        <div class="border-t p-4 bg-white shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
            <div class="flex justify-between items-center mb-4">
                <span class="text-gray-600 font-bold">總金額</span>
                <span class="text-2xl font-bold text-matcha-600">$<span id="cart-total">0</span></span>
            </div>
            <div class="space-y-3 mb-4">
                <div>
                    <label class="block text-sm text-gray-600 mb-1">姓名 / 暱稱 <span class="text-red-500">*</span></label>
                    <input type="text" id="order-customer-name" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-matcha-500 outline-none" placeholder="請輸入您的稱呼">
                </div>
                <div>
                    <label class="block text-sm text-gray-600 mb-1">備註 (選填)</label>
                    <input type="text" id="order-customer-notes" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-matcha-500 outline-none" placeholder="例：下午三點後拿">
                </div>
            </div>
            <button onclick="submitOrder()" class="w-full bg-matcha-500 hover:bg-matcha-600 text-white font-bold py-3 rounded-xl shadow-lg transition-colors flex justify-center items-center gap-2">
                <i class="fa-solid fa-paper-plane"></i> 送出訂單
            </button>
        </div>
    </div>

    <!-- Item Options Modal -->
    <div id="options-modal" class="fixed inset-0 bg-black bg-opacity-50 z-[60] fade-in flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-matcha-50 p-4 border-b flex justify-between items-center relative">
                <h3 id="modal-item-name" class="font-bold text-lg text-matcha-700">選擇選項</h3>
                <button onclick="closeOptionsModal()" class="text-gray-500 hover:text-gray-800 p-1">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <div class="p-5 overflow-y-auto flex-grow space-y-5">
                <!-- Size -->
                <div class="option-group" id="group-size">
                    <h4 class="font-medium text-gray-700 mb-2 border-l-2 border-wood pl-2 text-sm">容量</h4>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="border rounded-lg p-2 text-center cursor-pointer hover:bg-gray-50 option-label">
                            <input type="radio" name="opt-size" value="中杯(M)" class="hidden" checked>
                            <span class="block">中杯 (M)</span>
                        </label>
                        <label class="border rounded-lg p-2 text-center cursor-pointer hover:bg-gray-50 option-label">
                            <input type="radio" name="opt-size" value="大杯(L)" class="hidden" data-price-add="10">
                            <span class="block">大杯 (L) <span class="text-xs text-matcha-600">+$10</span></span>
                        </label>
                    </div>
                </div>
                
                <!-- Ice -->
                <div class="option-group" id="group-ice">
                    <h4 class="font-medium text-gray-700 mb-2 border-l-2 border-blue-300 pl-2 text-sm">冰塊</h4>
                    <div class="grid grid-cols-4 gap-2 text-sm">
                        <label class="border rounded-lg p-2 text-center cursor-pointer hover:bg-gray-50 option-label">
                            <input type="radio" name="opt-ice" value="正常冰" class="hidden" checked>正常冰
                        </label>
                        <label class="border rounded-lg p-2 text-center cursor-pointer hover:bg-gray-50 option-label">
                            <input type="radio" name="opt-ice" value="少冰" class="hidden">少冰
                        </label>
                        <label class="border rounded-lg p-2 text-center cursor-pointer hover:bg-gray-50 option-label">
                            <input type="radio" name="opt-ice" value="微冰" class="hidden">微冰
                        </label>
                        <label class="border rounded-lg p-2 text-center cursor-pointer hover:bg-gray-50 option-label">
                            <input type="radio" name="opt-ice" value="去冰" class="hidden">去冰
                        </label>
                        <label class="border rounded-lg p-2 text-center cursor-pointer hover:bg-gray-50 option-label col-span-2">
                            <input type="radio" name="opt-ice" value="溫" class="hidden">溫
                        </label>
                        <label class="border rounded-lg p-2 text-center cursor-pointer hover:bg-gray-50 option-label col-span-2">
                            <input type="radio" name="opt-ice" value="熱" class="hidden">熱
                        </label>
                    </div>
                </div>

                <!-- Sugar -->
                <div class="option-group" id="group-sugar">
                    <h4 class="font-medium text-gray-700 mb-2 border-l-2 border-orange-300 pl-2 text-sm">甜度</h4>
                    <div class="grid grid-cols-4 gap-2 text-sm">
                        <label class="border rounded-lg p-2 text-center cursor-pointer hover:bg-gray-50 option-label">
                            <input type="radio" name="opt-sugar" value="正常糖" class="hidden" checked>正常
                        </label>
                        <label class="border rounded-lg p-2 text-center cursor-pointer hover:bg-gray-50 option-label">
                            <input type="radio" name="opt-sugar" value="少糖" class="hidden">少糖
                        </label>
                        <label class="border rounded-lg p-2 text-center cursor-pointer hover:bg-gray-50 option-label">
                            <input type="radio" name="opt-sugar" value="半糖" class="hidden">半糖
                        </label>
                        <label class="border rounded-lg p-2 text-center cursor-pointer hover:bg-gray-50 option-label">
                            <input type="radio" name="opt-sugar" value="微糖" class="hidden">微糖
                        </label>
                        <label class="border rounded-lg p-2 text-center cursor-pointer hover:bg-gray-50 option-label col-span-2">
                            <input type="radio" name="opt-sugar" value="一分糖" class="hidden">一分糖
                        </label>
                        <label class="border rounded-lg p-2 text-center cursor-pointer hover:bg-gray-50 option-label col-span-2">
                            <input type="radio" name="opt-sugar" value="無糖" class="hidden">無糖
                        </label>
                    </div>
                </div>

                <!-- Toppings -->
                <div class="option-group" id="group-topping">
                    <h4 class="font-medium text-gray-700 mb-2 border-l-2 border-yellow-500 pl-2 text-sm">加料</h4>
                    <div class="grid grid-cols-2 gap-2 text-sm">
                        <label class="border rounded-lg p-2 text-center cursor-pointer hover:bg-gray-50 option-label">
                            <input type="radio" name="opt-topping" value="無" class="hidden" checked>無
                        </label>
                        <label class="border rounded-lg p-2 text-center cursor-pointer hover:bg-gray-50 option-label">
                            <input type="radio" name="opt-topping" value="白玉珍珠" class="hidden" data-price-add="10">白玉珍珠 <span class="text-xs text-matcha-600">+$10</span>
                        </label>
                        <label class="border rounded-lg p-2 text-center cursor-pointer hover:bg-gray-50 option-label">
                            <input type="radio" name="opt-topping" value="紅豆" class="hidden" data-price-add="15">蜜紅豆 <span class="text-xs text-matcha-600">+$15</span>
                        </label>
                        <label class="border rounded-lg p-2 text-center cursor-pointer hover:bg-gray-50 option-label">
                            <input type="radio" name="opt-topping" value="茶凍" class="hidden" data-price-add="15">綠茶凍 <span class="text-xs text-matcha-600">+$15</span>
                        </label>
                    </div>
                </div>
            </div>
            
            <div class="p-4 border-t bg-gray-50">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center border rounded-lg bg-white">
                        <button onclick="changeQty(-1)" class="px-3 py-1 text-gray-600 hover:bg-gray-100 rounded-l-lg"><i class="fa-solid fa-minus text-xs"></i></button>
                        <span id="modal-qty" class="px-4 font-medium">1</span>
                        <button onclick="changeQty(1)" class="px-3 py-1 text-gray-600 hover:bg-gray-100 rounded-r-lg"><i class="fa-solid fa-plus text-xs"></i></button>
                    </div>
                    <div class="text-lg font-bold text-matcha-600">
                        小計 $<span id="modal-subtotal">0</span>
                    </div>
                </div>
                <button onclick="confirmAddToCart()" class="w-full bg-matcha-500 hover:bg-matcha-600 text-white font-bold py-3 rounded-xl shadow transition-colors">
                    加入購物車
                </button>
            </div>
        </div>
    </div>

    <!-- Message Modal (Replaces Alert) -->
    <div id="msg-modal" class="fixed inset-0 bg-black bg-opacity-50 z-[100] fade-in flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden flex flex-col transform scale-95 transition-transform duration-300" id="msg-modal-content-box">
            <div class="p-6 text-center" id="msg-modal-body">
                <!-- Content injected via JS -->
            </div>
            <div class="p-4 bg-gray-50 border-t flex justify-center" id="msg-modal-footer">
                <button onclick="closeMsgModal()" class="bg-matcha-500 text-white px-6 py-2 rounded-lg font-medium hover:bg-matcha-600">確定</button>
            </div>
        </div>
    </div>

    <!-- Admin Login / Simple Dashboard Modal -->
    <div id="admin-login-modal" class="fixed inset-0 bg-black bg-opacity-50 z-[70] fade-in flex items-center justify-center p-4">
         <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden relative">
            <button onclick="document.getElementById('admin-login-modal').classList.remove('active')" class="absolute top-4 right-4 text-gray-500 hover:text-gray-800">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <div class="p-6">
                <h3 class="font-bold text-xl text-gray-800 mb-4 border-b pb-2"><i class="fa-solid fa-lock text-matcha-500 mr-2"></i>管理員登入</h3>
                <p class="text-sm text-gray-500 mb-4">將連線至 Firebase 雲端資料庫讀取所有訂單。</p>
                <button onclick="openAdminDashboard()" class="w-full bg-gray-800 text-white py-2 rounded-lg font-bold hover:bg-gray-900 transition">連線至雲端後台</button>
            </div>
         </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
             const firebaseConfig = {
  apiKey: "AIzaSyCKeMDUHPL5uexN5QmYg5VdVZRJ9CMlKIk",
  authDomain: "drinks-e1c77.firebaseapp.com",
  projectId: "drinks-e1c77",
  storageBucket: "drinks-e1c77.firebasestorage.app",
  messagingSenderId: "565299908319",
  appId: "1:565299908319:web:0ce7b6a2412a30d57c636a"
};

        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let currentUser = null;

        // 嚴格遵守 Firebase 資料庫路徑設計規範 (Public Data)
        const PATH_ORDERS = `artifacts/${appId}/public/data/tea_orders`;
        
        const state = {
            cart: [],
            campaign: { 
                isActive: true, 
                title: '夏季抹茶特賞', 
                activeShopId: 'shop_1' 
            },
            shops: [
                { id: 'shop_1', name: '和風茶屋 (本店)' }
            ],
            menu: [
                { id: 'm1', name: '宇治抹茶拿鐵', price: 70, category: '特調飲品', hasOptions: true, img: 'fa-mug-hot' },
                { id: 'm2', name: '焙茶鮮奶', price: 65, category: '特調飲品', hasOptions: true, img: 'fa-mug-saucer' },
                { id: 'm3', name: '極上玄米茶', price: 40, category: '純粹好茶', hasOptions: true, img: 'fa-glass-water' },
                { id: 'm4', name: '白玉抹茶冰淇淋', price: 90, category: '和風甜點', hasOptions: false, img: 'fa-ice-cream' },
                { id: 'm5', name: '櫻花水信玄餅', price: 55, category: '和風甜點', hasOptions: false, img: 'fa-fan' },
                { id: 'm6', name: '黑糖蕨餅', price: 60, category: '和風甜點', hasOptions: false, img: 'fa-cube' }
            ],
            tempItem: null 
        };

        // 因為使用 type="module"，必須將 HTML 中 onclick 呼叫的函數掛載到 window 上
        window.closeMsgModal = closeMsgModal;
        window.handleItemClick = handleItemClick;
        window.closeOptionsModal = closeOptionsModal;
        window.changeQty = changeQty;
        window.confirmAddToCart = confirmAddToCart;
        window.toggleCart = toggleCart;
        window.removeCartItem = removeCartItem;
        window.submitOrder = submitOrder;
        window.openAdminDashboard = openAdminDashboard;

        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    const credential = await signInWithCustomToken(auth, __initial_auth_token);
                    currentUser = credential.user;
                } else {
                    const credential = await signInAnonymously(auth);
                    currentUser = credential.user;
                }
                console.log("Firebase Auth Success, UID:", currentUser.uid);
            } catch (error) {
                console.error("Firebase Auth Error:", error);
                showModal('錯誤', '系統連線異常，部分功能可能無法使用。');
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            // 必須在執行任何資料庫操作前完成驗證
            await initAuth(); 
            renderMenu();
            updateCartUI();
            setupRadioStyling();
        });

        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';

            state.menu.forEach(item => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-row hover:shadow-md transition-shadow';
                card.innerHTML = `
                    <div class="w-24 bg-matcha-50 flex items-center justify-center text-matcha-400 text-3xl shrink-0">
                        <i class="fa-solid ${item.img}"></i>
                    </div>
                    <div class="p-4 flex-grow flex flex-col justify-center">
                        <span class="text-xs text-wood-dark font-medium mb-1">${item.category}</span>
                        <h3 class="font-bold text-gray-800 text-lg leading-tight mb-2">${item.name}</h3>
                        <div class="flex justify-between items-center mt-auto">
                            <span class="text-matcha-600 font-bold">$${item.price}</span>
                            <button onclick="handleItemClick('${item.id}')" class="bg-matcha-100 text-matcha-700 hover:bg-matcha-500 hover:text-white px-3 py-1 rounded-lg text-sm font-medium transition-colors">
                                ${item.hasOptions ? '選擇' : '加入'}
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function showModal(title, bodyHtml, hideFooter = false) {
            const modal = document.getElementById('msg-modal');
            const contentBox = document.getElementById('msg-modal-content-box');
            
            document.getElementById('msg-modal-body').innerHTML = `
                <h3 class="font-bold text-xl mb-3 text-gray-800">${title}</h3>
                <div class="text-gray-600">${bodyHtml}</div>
            `;
            
            document.getElementById('msg-modal-footer').style.display = hideFooter ? 'none' : 'flex';
            
            modal.classList.add('active');
            setTimeout(() => contentBox.classList.remove('scale-95'), 10);
        }

        function closeMsgModal() {
            const modal = document.getElementById('msg-modal');
            const contentBox = document.getElementById('msg-modal-content-box');
            contentBox.classList.add('scale-95');
            setTimeout(() => modal.classList.remove('active'), 200);
        }

        function setupRadioStyling() {
            document.querySelectorAll('.option-label').forEach(label => {
                const radio = label.querySelector('input[type="radio"]');
                radio.addEventListener('change', () => {
                    const groupName = radio.name;
                    document.querySelectorAll(`input[name="${groupName}"]`).forEach(inp => {
                        inp.closest('.option-label').classList.remove('border-matcha-500', 'bg-matcha-50', 'text-matcha-700');
                        inp.closest('.option-label').classList.add('border-gray-200');
                    });
                    if(radio.checked) {
                        label.classList.remove('border-gray-200');
                        label.classList.add('border-matcha-500', 'bg-matcha-50', 'text-matcha-700');
                    }
                    updateModalSubtotal();
                });
            });
        }

        function handleItemClick(itemId) {
            const item = state.menu.find(m => m.id === itemId);
            if (!item) return;

            if (item.hasOptions) {
                openOptionsModal(item);
            } else {
                state.cart.push({
                    cartId: Date.now().toString(),
                    id: item.id,
                    name: item.name,
                    price: item.price,
                    qty: 1,
                    size: '預設',
                    ice: null,
                    sugar: null,
                    topping: null
                });
                updateCartUI();
                showToast(`已加入: ${item.name}`);
            }
        }

        function openOptionsModal(item) {
            state.tempItem = { ...item, qty: 1 };
            document.getElementById('modal-item-name').textContent = item.name;
            document.getElementById('modal-qty').textContent = '1';
            
            document.querySelectorAll('input[type="radio"]').forEach(r => {
                if(r.defaultChecked) r.checked = true;
                r.dispatchEvent(new Event('change')); 
            });

            const isDrink = item.category === '特調飲品' || item.category === '純粹好茶';
            document.getElementById('group-ice').style.display = isDrink ? 'block' : 'none';
            document.getElementById('group-sugar').style.display = isDrink ? 'block' : 'none';
            document.getElementById('group-size').style.display = isDrink ? 'block' : 'none';
            document.getElementById('group-topping').style.display = isDrink ? 'block' : 'none';

            updateModalSubtotal();
            document.getElementById('options-modal').classList.add('active');
        }

        function closeOptionsModal() {
            document.getElementById('options-modal').classList.remove('active');
            state.tempItem = null;
        }

        function changeQty(delta) {
            if(!state.tempItem) return;
            state.tempItem.qty += delta;
            if (state.tempItem.qty < 1) state.tempItem.qty = 1;
            document.getElementById('modal-qty').textContent = state.tempItem.qty;
            updateModalSubtotal();
        }

        function updateModalSubtotal() {
            if(!state.tempItem) return;
            let basePrice = state.tempItem.price;
            let extraPrice = 0;
            
            const sizeRadio = document.querySelector('input[name="opt-size"]:checked');
            if(sizeRadio && sizeRadio.dataset.priceAdd) extraPrice += parseInt(sizeRadio.dataset.priceAdd);
            
            const toppingRadio = document.querySelector('input[name="opt-topping"]:checked');
            if(toppingRadio && toppingRadio.dataset.priceAdd) extraPrice += parseInt(toppingRadio.dataset.priceAdd);

            const total = (basePrice + extraPrice) * state.tempItem.qty;
            document.getElementById('modal-subtotal').textContent = total;
        }

        function confirmAddToCart() {
            if(!state.tempItem) return;
            
            const isDrink = state.tempItem.category === '特調飲品' || state.tempItem.category === '純粹好茶';
            let extraPrice = 0;
            let finalSize = '預設';
            let finalIce = null;
            let finalSugar = null;
            let finalTopping = null;

            if (isDrink) {
                const sizeEl = document.querySelector('input[name="opt-size"]:checked');
                finalSize = sizeEl.value;
                if(sizeEl.dataset.priceAdd) extraPrice += parseInt(sizeEl.dataset.priceAdd);

                finalIce = document.querySelector('input[name="opt-ice"]:checked').value;
                finalSugar = document.querySelector('input[name="opt-sugar"]:checked').value;
                
                const toppingEl = document.querySelector('input[name="opt-topping"]:checked');
                finalTopping = toppingEl.value;
                if(toppingEl.dataset.priceAdd) extraPrice += parseInt(toppingEl.dataset.priceAdd);
            }

            const cartItem = {
                cartId: Date.now().toString(),
                id: state.tempItem.id,
                name: state.tempItem.name,
                price: state.tempItem.price + extraPrice,
                qty: state.tempItem.qty,
                size: finalSize,
                ice: finalIce,
                sugar: finalSugar,
                topping: finalTopping
            };

            state.cart.push(cartItem);
            updateCartUI();
            closeOptionsModal();
            showToast(`已加入: ${cartItem.name}`);
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-full shadow-lg z-50 text-sm opacity-0 transition-opacity duration-300';
            toast.textContent = msg;
            document.body.appendChild(toast);
            
            setTimeout(() => toast.classList.remove('opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        function toggleCart() {
            const sidebar = document.getElementById('cart-sidebar');
            const overlay = document.getElementById('cart-overlay');
            
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        function removeCartItem(cartId) {
            state.cart = state.cart.filter(item => item.cartId !== cartId);
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            const badge = document.getElementById('cart-badge');
            const totalEl = document.getElementById('cart-total');
            
            const totalQty = state.cart.reduce((sum, item) => sum + item.qty, 0);
            badge.textContent = totalQty;
            if(totalQty > 0) badge.classList.remove('scale-0');
            else badge.classList.add('scale-0');

            if(state.cart.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-400 py-10 flex flex-col items-center"><i class="fa-solid fa-ghost text-4xl mb-3 opacity-30"></i>購物車空空如也</div>';
                totalEl.textContent = '0';
                return;
            }

            let html = '';
            let grandTotal = 0;

            state.cart.forEach(item => {
                const lineTotal = item.price * item.qty;
                grandTotal += lineTotal;
                
                let detailText = '';
                if(item.ice && item.sugar) {
                    detailText = `<div class="text-xs text-gray-500 mt-1">${item.size !== '預設' ? item.size + ' / ' : ''}${item.ice} / ${item.sugar} ${item.topping && item.topping!=='無' ? '/ +'+item.topping : ''}</div>`;
                }

                html += `
                    <div class="bg-white p-3 rounded-xl border border-gray-100 shadow-sm relative">
                        <button onclick="removeCartItem('${item.cartId}')" class="absolute -top-2 -right-2 bg-red-100 text-red-500 rounded-full w-6 h-6 flex items-center justify-center hover:bg-red-500 hover:text-white transition-colors">
                            <i class="fa-solid fa-xmark text-xs"></i>
                        </button>
                        <div class="flex justify-between items-start">
                            <div>
                                <h4 class="font-bold text-gray-800 text-sm">${item.name}</h4>
                                ${detailText}
                            </div>
                            <div class="text-right">
                                <div class="text-matcha-600 font-bold text-sm">$${item.price}</div>
                                <div class="text-xs text-gray-500">x${item.qty} = $${lineTotal}</div>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            totalEl.textContent = grandTotal;
        }

        async function submitOrder() {
            if (!currentUser) return showModal('提示', '系統尚未準備就緒或尚未驗證身份，請稍候重試！');
            if (state.cart.length === 0) return showModal('提示', '購物車是空的！');
            
            if (!state.campaign || !state.campaign.isActive) {
                return showModal('無法訂購', '目前訂購任務已結束！');
            }

            const shop = state.shops.find(s => s.id === state.campaign.activeShopId);
            if (!shop) return showModal('無法訂購', '店家資料異常！');

            const name = document.getElementById('order-customer-name').value.trim();
            if (!name) return showModal('提示', '請輸入您的姓名或暱稱！');
            
            const notes = document.getElementById('order-customer-notes').value.trim();
            const total = state.cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            // 準備寫入 Firebase 的資料
            const orderData = {
                shopId: shop.id,
                shopName: shop.name,
                campaignTitle: state.campaign.title,
                customerName: name,
                notes: notes,
                items: [...state.cart], // 陣列物件
                totalAmount: total,
                status: 'pending',
                createdAt: new Date().toISOString(), // 方便稍後在記憶體中排序
                userId: currentUser.uid // 綁定下單者
            };

            try {
                showModal('處理中', '<div class="text-center py-6"><div class="loader mx-auto mb-4"></div><p>正在同步訂單至雲端...</p></div>', true);
                
                // 1. 寫入 Firebase Firestore
                await addDoc(collection(db, PATH_ORDERS), orderData);
                
                // 2. LINE Notify 通知系統
                try {
                    let itemsText = state.cart.map(i => {
                        let vText = '';
                        if(i.ice && i.sugar) {
                            vText = `${i.size !== '預設' ? i.size + '杯, ' : ''}${i.ice}, ${i.sugar}`;
                            if (i.topping && i.topping !== '無') vText += `, +${i.topping}`;
                        } else if (i.size && i.size !== '預設') {
                            vText = `${i.size}杯`;
                        }
                        return `- ${i.name} ${vText ? `(${vText})` : ''} x${i.qty}`;
                    }).join('\n');

                    let msg = `【🍵新訂單通知】\n任務：${state.campaign.title}\n訂購人：${name}\n\n${itemsText}\n\n總計：$${total}`;
                    if(notes) msg += `\n備註：${notes}`;
                    
                    const lineUrl = `https://v2.chateverywhere.app/api/line/notify?token=slJRvHrUnyBVS8ETTZHCSt-0GkqK-zBC&message=${encodeURIComponent(msg)}`;
                    fetch(lineUrl, { method: 'GET', mode: 'no-cors' }).catch(e => console.error('Line notify background fail', e));
                } catch(lineErr) {
                    console.error('Line Notify error:', lineErr);
                }

                // 3. 成功後清空狀態
                state.cart = [];
                updateCartUI();
                document.getElementById('order-customer-name').value = '';
                document.getElementById('order-customer-notes').value = '';
                toggleCart();
                
                showModal('訂購成功', `<div class="text-center"><i class="fa-solid fa-circle-check text-5xl text-matcha-500 mb-4"></i><p class="text-lg font-bold text-gray-800">您的訂單已送出並儲存至雲端！</p><p class="text-sm text-gray-500 mt-2">已同步發送 LINE 通知。</p></div>`);
            } catch (error) {
                console.error("Firebase write error", error);
                showModal('錯誤', '送出訂單失敗，請檢查網路連線。');
            }
        };

        async function openAdminDashboard() {
            if (!currentUser) return showModal('提示', '尚未驗證身分，無法存取雲端資料庫。');
            
            document.getElementById('admin-login-modal').classList.remove('active');
            showModal('讀取中', '<div class="text-center py-6"><div class="loader mx-auto mb-4"></div><p>正在從 Firebase 載入訂單...</p></div>', true);

            try {
                // 從 Firebase 獲取所有公開的訂單
                const snapshot = await getDocs(collection(db, PATH_ORDERS));
                let orders = [];
                snapshot.forEach(doc => {
                    orders.push({ id: doc.id, ...doc.data() });
                });

                // 在記憶體中進行排序 (依照時間由新到舊)
                orders.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

                let html = '<div class="text-left max-h-96 overflow-y-auto pr-2 space-y-3">';
                
                if(orders.length === 0) {
                    html += '<p class="text-center text-gray-400 py-10">雲端尚無訂單資料</p>';
                } else {
                    orders.forEach(o => {
                        let itemsHtml = o.items.map(i => `<div class="text-xs text-gray-600 border-b border-gray-100 last:border-0 py-1">• ${i.name} x${i.qty}</div>`).join('');
                        
                        // 轉換 ISO 時間字串為可讀格式
                        let timeStr = '時間未知';
                        if (o.createdAt) {
                            const d = new Date(o.createdAt);
                            timeStr = `${d.getMonth()+1}/${d.getDate()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
                        }

                        html += `
                            <div class="bg-gray-50 border rounded-lg p-3">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="font-bold text-sm text-matcha-700">${o.customerName} <span class="text-xs text-gray-400 font-normal ml-1">${timeStr}</span></span>
                                    <span class="text-xs bg-yellow-100 text-yellow-700 px-2 rounded-full">已同步</span>
                                </div>
                                <div class="bg-white p-2 rounded mb-2 border border-gray-100">
                                    ${itemsHtml}
                                </div>
                                <div class="flex justify-between text-xs text-gray-500">
                                    <span>總計: <strong class="text-gray-800">$${o.totalAmount}</strong></span>
                                    <span>${o.notes ? '備註: '+o.notes : '無備註'}</span>
                                </div>
                            </div>
                        `;
                    });
                }
                html += '</div>';
                
                showModal('雲端訂單管理系統', html);
            } catch (error) {
                console.error("Firebase fetch error", error);
                showModal('錯誤', '無法讀取訂單資料，可能權限不足或連線異常。');
            }
        }
    </script>
